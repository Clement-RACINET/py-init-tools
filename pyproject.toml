[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "py-init-tools"
version = "2026.10.22"
description = "Safe audit and generation of Python package __init__.py files."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Clément RACINET" }
]
license = { text = "X11" }
keywords = [
  "python",
  "package",
  "__init__",
  "init",
  "automation",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://gitlab.com/dev-tools-cr/python/py-init-tools"
Repository = "https://gitlab.com/dev-tools-cr/python/py-init-tools"

[project.scripts]
pyinit = "py_init_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_init_tools"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "ISC001",
  "T201",
]


[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = [
  "src",
]
exclude = [
  "**/__pycache__",
  ".pixi",
  ".ruff_cache",
  ".pytest_cache",
  "build",
  "dist",
]

[tool.py-init-tools]
package_roots = ["src/py_init_tools"]

package_description = "Python __init__.py management tools."

generate_root_reexports = false
reexport_allowlist = []

discovery_mode = "classes_functions"
export_constants = false
export_type_aliases = false