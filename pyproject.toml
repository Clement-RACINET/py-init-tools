[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "py-init-tools"
version = "0.2.1"
description = "Safe audit and generation of Python package __init__.py files."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Clément RACINET" }
]
license = { text = "MIT" }
keywords = [
  "python",
  "package",
  "__init__",
  "init",
  "automation",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://gitlab.com/dev-tools-cr/python/py-init-tools"
Repository = "https://gitlab.com/dev-tools-cr/python/py-init-tools"

[project.scripts]
pyinit = "py_init_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_init_tools"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "ISC001",
  "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D",
  "S101",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = [
  "src",
  "tests",
]
exclude = [
  "**/__pycache__",
  ".pixi",
  ".ruff_cache",
  ".pytest_cache",
  "build",
  "dist",
]

[tool.py-init-tools]
package_roots = ["src/py_init_tools"]
test_roots = ["tests"]

package_version = "0.2.1"
package_description = "Python __init__.py management tools."

generate_root_reexports = false
reexport_allowlist = []

discovery_mode = "classes_functions"
export_constants = false
export_type_aliases = false


[tool.coverage.run]
branch = true
source = ["py_init_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
  "src/py_init_tools",
  "*/site-packages/py_init_tools",
]
